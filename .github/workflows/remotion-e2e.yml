name: Remotion E2E

on:
  pull_request:
    paths:
      - "packages/remotion-renderer/**"
      - "apps/remotion-site/**"
      - "packages/motion-runtime/**"
      - "packages/motion-compiler/**"
      - ".github/workflows/remotion-e2e.yml"
  push:
    branches: [main, master, dev]
    paths:
      - "packages/remotion-renderer/**"
      - "apps/remotion-site/**"
      - "packages/motion-runtime/**"
      - "packages/motion-compiler/**"
      - ".github/workflows/remotion-e2e.yml"

concurrency:
  group: remotion-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remotion-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Remotion Chromium
        run: pnpm --filter @motionvideo/remotion-site exec remotion browser ensure

      - name: Encode smoke MP4
        env:
          REMOTION_E2E_REQUIRE: "1"
        run: pnpm e2e:remotion

      - name: Upload smoke MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke-mp4
          path: tmp/remotion-smoke/smoke.mp4
          if-no-files-found: ignore
