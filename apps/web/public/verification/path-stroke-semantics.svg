<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#101820"/>

  <!-- SVG reference: miter join. The pointed tip is intentional. -->
  <path d="M 180 250 L 350 130 L 520 250"
        fill="none" stroke="#f97316" stroke-width="28"
        stroke-linejoin="miter" stroke-miterlimit="4"/>

  <!-- SVG reference: one closed dashed contour. -->
  <path d="M 690 170 L 860 125 L 1035 185 L 985 330 L 800 345 Z"
        fill="#00aa88" fill-opacity="0.85"
        stroke="#ff3366" stroke-width="18"
        stroke-linejoin="round" stroke-linecap="butt"
        stroke-dasharray="72 28" stroke-dashoffset="0"/>

  <!-- SVG reference: primitive rectangle stroke. -->
  <rect x="1250" y="170" width="420" height="240"
        fill="#00aa88" fill-opacity="0.45"
        stroke="#f8fafc" stroke-opacity="0.7" stroke-width="18"
        stroke-linejoin="miter"/>

  <g font-family="sans-serif" font-size="24" fill="#b7c4d1">
    <text x="180" y="470">miter join: pointed tip is valid SVG geometry</text>
    <text x="690" y="470">closed path + dash + round join</text>
    <text x="1250" y="470">rect stroke: no path join patch artifact</text>
  </g>
</svg>
