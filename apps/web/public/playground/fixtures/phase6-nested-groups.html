<!doctype html>
<html lang="en">
  <head>

    <style data-neonix-bundle>
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: linear-gradient(180deg, #c8cdd3 0%, #9aa3ad 100%);

        top: 90px;
        margin: 0;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.03em;
        z-index: 10;
      }
      .outer-group {
        position: absolute;
        left: 220px;
        top: 220px;
        width: 980px;
        height: 640px;
        opacity: 0.72;
        isolation: isolate;
      }
      .inner-group {
        position: absolute;
        left: 80px;
        top: 60px;
        width: 720px;
        height: 480px;
        overflow: hidden;
        border-radius: 36px;
        background: #38bdf8;
        filter: contrast(1.18) brightness(1.08);
        clip-path: inset(24px 36px round 28px);
      }
      .child-shape {
        position: absolute;
        left: 120px;
        top: 100px;
        width: 420px;
        height: 260px;
        border-radius: 40px;
        background: #f97316;

        position: absolute;

        top: 160px;
        width: 360px;
        height: 280px;
        border-radius: 50%;
        background: #a78bfa;
        opacity: 0.65;
      }
      .outside-sibling {
        position: absolute;
        left: 1180px;
        top: 320px;
        width: 420px;
        height: 360px;
        border-radius: 40px;
        background: #facc15;
        mix-blend-mode: multiply;
        opacity: 0.85;
        z-index: 5;
      }
      .clip-panel {
        position: absolute;
        left: 1280px;
        top: 160px;
        width: 320px;
        height: 220px;
        background: #14b8a6;

      }
    </style>
  </head>
  <body>
    <h1 class="label">Nested groups / opacity · filter · blend · clip</h1>
    <div class="outer-group">
      <div class="inner-group">
        <div class="child-shape"></div>
        <div class="child-ellipse"></div>
      </div>
    </div>
    <div class="outside-sibling"></div>
    <div class="clip-panel"></div>
  </body>
</html>
