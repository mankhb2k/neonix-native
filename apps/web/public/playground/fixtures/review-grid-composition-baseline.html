<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        position: relative;
        overflow: hidden;
        background: #081018;
      }

      * { box-sizing: border-box; }

      /* Copied from the compositing baseline, intentionally without opacity
         or any other layer. This isolates grid geometry and paint order. */
      .grid-composition-baseline {
        position: absolute;
        left: 120px;
        top: 120px;
        width: 1680px;
        height: 840px;
        background:
          repeating-linear-gradient(0deg, #284457 0%, #284457 0.0833%, transparent 0.0833%, transparent 8.3333%),
          repeating-linear-gradient(90deg, #284457 0%, #284457 0.0833%, transparent 0.0833%, transparent 8.3333%);
        background-size: 120px 120px, 120px 120px;
      }
    </style>
  </head>
  <body><div class="grid-composition-baseline"></div></body>
</html>
