<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        position: relative;
        overflow: hidden;
        background: #081018;
      }

      * { box-sizing: border-box; }

      /* Deliberately identical to the 30% fixture except that the opacity
         declaration is omitted. CSS therefore supplies its default value. */
      .grid-default-opacity {
        position: absolute;
        left: 480px;
        top: 300px;
        width: 960px;
        height: 480px;
      }

      .grid-lines-default-opacity {
        width: 960px;
        height: 480px;
        background:
          repeating-linear-gradient(90deg, #38bdf8 0%, #38bdf8 1%, transparent 1%, transparent 12.5%),
          repeating-linear-gradient(0deg, #38bdf8 0%, #38bdf8 1%, transparent 1%, transparent 25%);
      }
    </style>
  </head>
  <body><div class="grid-default-opacity"><div class="grid-lines-default-opacity"></div></div></body>
</html>
