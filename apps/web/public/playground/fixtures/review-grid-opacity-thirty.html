<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        position: relative;
        overflow: hidden;
        background: #081018;
      }

      * { box-sizing: border-box; }

      /* Keep the test intentionally grid-only. Both axes use the same
         120px cell so a spacing or transform error is easy to spot. The
         parent owns opacity so the two grid axes share one compositing
         boundary, just as they do in browser CSS. */
      .grid-opacity-thirty {
        position: absolute;
        left: 480px;
        top: 300px;
        width: 960px;
        height: 480px;
        opacity: 0.3;
      }

      .grid-lines-opacity-thirty {
        width: 960px;
        height: 480px;
        background:
          repeating-linear-gradient(90deg, #38bdf8 0%, #38bdf8 1%, transparent 1%, transparent 12.5%),
          repeating-linear-gradient(0deg, #38bdf8 0%, #38bdf8 1%, transparent 1%, transparent 25%);
      }
    </style>
  </head>
  <body><div class="grid-opacity-thirty"><div class="grid-lines-opacity-thirty"></div></div></body>
</html>
