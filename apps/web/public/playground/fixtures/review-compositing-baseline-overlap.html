<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":2000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        position: relative;
        overflow: hidden;
        background: #081018;
        color: #f8fafc;
        font-family: "Inter", sans-serif;
      }

      * { box-sizing: border-box; }

      .grid {
        position: absolute;
        left: 120px;
        top: 120px;
        width: 1680px;
        height: 840px;
        opacity: 0.18;
        background:
          repeating-linear-gradient(0deg, #284457 0%, #284457 0.0833%, transparent 0.0833%, transparent 8.3333%),
          repeating-linear-gradient(90deg, #284457 0%, #284457 0.0833%, transparent 0.0833%, transparent 8.3333%);
        background-size: 120px 120px, 120px 120px;
      }

      .eyebrow {
        position: absolute;
        left: 180px;
        top: 170px;
        color: #4ade80;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.22em;
      }

      .headline {
        position: absolute;
        left: 180px;
        top: 270px;
        margin: 0;
        color: #f8fafc;
        font-size: 92px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .headline-accent { color: #22d3ee; }

      .cyan-card {
        position: absolute;
        left: 330px;
        top: 500px;
        width: 620px;
        height: 300px;
        border-radius: 44px;
        background: #22d3ee;
        opacity: 0.55;
      }

      .purple-ellipse {
        position: absolute;
        left: 700px;
        top: 430px;
        width: 620px;
        height: 360px;
        border-radius: 50%;
        background: #a78bfa;
        opacity: 0.58;
      }

      .yellow-plate {
        position: absolute;
        left: 1110px;
        top: 310px;
        width: 300px;
        height: 210px;
        background: #facc15;
        opacity: 0.72;
        transform: rotate(-12deg);
        transform-origin: center;
      }

      .overlap-label {
        position: absolute;
        left: 780px;
        top: 650px;
        color: #f8fafc;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .caption {
        position: absolute;
        left: 180px;
        bottom: 120px;
        color: #94a3b8;
        font-size: 24px;
        font-weight: 400;
        letter-spacing: 0.03em;
      }

      .baseline-rule {
        position: absolute;
        left: 180px;
        right: 180px;
        bottom: 82px;
        height: 2px;
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="eyebrow">NEONIX / COMPOSITING BASELINE</div>
    <h1 class="headline">Alpha <span class="headline-accent">overlap.</span></h1>
    <div class="cyan-card"></div>
    <div class="purple-ellipse"></div>
    <div class="yellow-plate"></div>
    <div class="overlap-label">One layer. One opacity boundary.</div>
    <div class="caption">Browser CSS reference / Protocol V2 / Skia output</div>
    <div class="baseline-rule"></div>
  </body>
</html>
