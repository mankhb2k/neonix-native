<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"background":"#f3f0e8","colorSpace":"srgb"}}'>
  <style>
    @keyframes title-rise {
      0%, 8% { opacity: 0; transform: translateY(58px); }
      24%, 82% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
    @keyframes shape-breathe {
      0%, 100% { transform: rotate(-8deg) scale(0.92); }
      50% { transform: rotate(18deg) scale(1.08); }
    }
    @keyframes shape-slide {
      0%, 10% { opacity: 0; transform: translateX(100px) rotate(12deg); }
      28%, 78% { opacity: 1; transform: translateX(0) rotate(-12deg); }
      100% { opacity: 0; transform: translateX(-80px) rotate(-32deg); }
    }
    @keyframes bars {
      0%, 100% { height: 22px; }
      50% { height: 78px; }
    }
    @keyframes color-wash {
      0%, 100% { background-color: #ff6a5b; }
      50% { background-color: #6e7dff; }
    }
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
    body { color: #171a26; background: #f3f0e8; font-family: Inter, "Noto Sans", Arial, sans-serif; }
    .stage { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(120deg, #f3f0e8, #e9e5d9); }
    .grain { position: absolute; inset: 0; opacity: 0.18; background-image: url("/preview/image/img-alpha.png"); background-size: cover; background-repeat: no-repeat; mix-blend-mode: multiply; }
    .accent { position: absolute; width: 490px; height: 490px; right: 115px; top: 130px; background: #ff6a5b; filter: blur(2px); animation: shape-breathe 10s ease infinite, color-wash 10s ease infinite; }
    .accent-two { position: absolute; width: 240px; height: 240px; left: 110px; bottom: 130px; border: 34px solid #6e7dff; border-radius: 50%; opacity: 0.85; animation: shape-slide 10s ease infinite; }
    .copy { position: absolute; left: 150px; top: 160px; width: 920px; animation: title-rise 10s ease infinite; }
    .kicker { color: #6e7dff; font-size: 18px; letter-spacing: 0.26em; font-weight: 800; }
    h1 { margin: 22px 0; max-width: 840px; font-size: 104px; line-height: 0.94; letter-spacing: -0.07em; }
    .serif { font-family: Lora, Georgia, serif; font-weight: 400; }
    .copy p { max-width: 620px; margin: 0; color: #5d6170; font-family: Lora, Georgia, serif; font-size: 25px; line-height: 1.48; }
    .shape-row { position: absolute; left: 150px; bottom: 160px; width: 360px; height: 80px; display: flex; gap: 16px; }
    .shape { width: 72px; height: 72px; border-radius: 18px; }
    .shape-red { background: #ff6a5b; transform: rotate(12deg); }
    .shape-blue { background: #6e7dff; border-radius: 50%; }
    .shape-dark { background: #171a26; border-radius: 8px; transform: rotate(45deg); }
    .shape-outline { border: 5px solid #171a26; border-radius: 50%; }
    .audio-card { position: absolute; right: 170px; bottom: 142px; width: 530px; height: 260px; padding: 25px 28px; border: 1px solid #b5b0a4; border-radius: 18px; background: #fffdf5; opacity: 0.9; box-shadow: 0 18px 50px #776b50; }
    .audio-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .audio-title { font-weight: 800; }
    .audio-duration { color: #6e7dff; }
    .wave { height: 90px; display: flex; align-items: center; gap: 7px; }
    .bar { display: block; flex: none; width: 18px; height: 48px; border-radius: 4px; background: #171a26; animation: bars 1.1s ease infinite; }
    .bar-alt { animation-delay: -0.35s; background: #ff6a5b; }
    .bar-blue { animation-delay: -0.7s; background: #6e7dff; }
    .audio-footer { display: flex; justify-content: space-between; margin-top: 15px; color: #777b88; font-size: 13px; }
    .footer-label { position: absolute; left: 150px; right: 170px; top: 72px; display: flex; justify-content: space-between; color: #777b88; font-size: 13px; letter-spacing: 0.14em; }
  </style>
</head>
<body>
  <main class="stage">
    <div class="grain"></div>
    <div class="accent"></div>
    <div class="accent-two"></div>
    <div class="footer-label"><span>Neonix / audio study</span><span>10 seconds / 30 fps</span></div>
    <section class="copy"><div class="kicker">Sound becomes shape</div><h1>Make the moment <span class="serif">move.</span></h1><p>Typography, geometric rhythm and an independent audio bed become one measurable native export.</p></section>
    <section class="shape-row"><div class="shape shape-red"></div><div class="shape shape-blue"></div><div class="shape shape-dark"></div><div class="shape shape-outline"></div></section>
    <section class="audio-card"><div class="audio-head"><span class="audio-title">Island Tropical / source audio</span><span class="audio-duration">00:10</span></div><div class="wave"><i class="bar"></i><i class="bar bar-alt"></i><i class="bar bar-blue"></i><i class="bar"></i><i class="bar bar-alt"></i><i class="bar bar-blue"></i><i class="bar"></i><i class="bar bar-alt"></i><i class="bar bar-blue"></i><i class="bar"></i><i class="bar bar-alt"></i><i class="bar bar-blue"></i><i class="bar"></i><i class="bar bar-alt"></i><i class="bar bar-blue"></i><i class="bar"></i><i class="bar bar-alt"></i><i class="bar bar-blue"></i><i class="bar"></i><i class="bar bar-alt"></i></div><div class="audio-footer"><span>MP3 / 44.1 kHz / stereo</span><span>Neonix Audio</span></div></section>
    <audio id="audio-bed" src="/preview/audio/Music-MBB-Island-Tropical_128k.mp3"></audio>
  </main>
</body>
</html>
