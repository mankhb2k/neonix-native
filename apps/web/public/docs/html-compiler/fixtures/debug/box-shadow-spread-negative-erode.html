<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 900px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Case 3 - negative spread (erode) large enough that radius + spread
        goes negative (40 + (-50) = -10). This is the one regime where
        clamping is NOT a no-op: Chrome's ConstrainRadii() (and our
        outsetSilhouette()) must floor the corner radius to 0, turning the
        eroded silhouette into a plain (non-rounded) rect rather than a
        negative-radius shape. 300x150 at spread:-50 also shrinks to
        200x50 - still positive dimensions, so only the radius floor is
        being exercised here, not the (mathematically unreachable for
        positive spread, see case 2) upper radius clamp.
      */
      .panel {
        position: absolute;
        left: 760px;
        top: 465px;
        width: 300px;
        height: 150px;
        border-radius: 40px;
        background: #a3e635;
        box-shadow: 0 0 30px -50px #a3e635;
      }
    </style>
  </head>
  <body>
    <div class="label">box-shadow spread debug - case 3: negative spread erode (radius=40, spread=-50) - radius floors to 0</div>
    <div id="spread-negative-erode" class="panel"></div>
  </body>
</html>
