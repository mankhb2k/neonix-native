<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 1400px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Foundation check before anything else: box-shadow's 6 components are
        offset-x, offset-y, blur-radius, spread-radius, color, inset -
        offset-x/offset-y are the most basic (they only translate the shadow,
        no shape change at all), so they are the right place to first prove
        a clean 1:1 pixel match against real Chrome. spread:0 here on
        purpose - this sweep must go through effects.ts's simplest
        recognizer (matchEffectGraph ["alpha-mask","blur","tint","offset",
        "composite"], no morphology op at all), fully isolated from the
        known spread/dilate bug.
        Three offset-x examples: negative (shadow left of the box), a small
        positive, and a larger positive - same box, same blur, same
        spread:0, only offset-x changes. offset-y stays 0 throughout.
      */
      .tile { position: absolute; width: 200px; height: 200px; top: 460px; border-radius: 24px; background: #22d3ee; }
      .caption { position: absolute; width: 280px; top: 900px; text-align: center; color: #94a3b8; font-family: Inter, sans-serif; font-size: 16px; font-weight: 700; }

      .offset-neg60 { left: 260px; box-shadow: -60px 0 24px 0 #22d3ee; }
      .offset-pos20 { left: 860px; box-shadow: 20px 0 24px 0 #22d3ee; }
      .offset-pos120 { left: 1460px; box-shadow: 120px 0 24px 0 #22d3ee; }

      .caption-neg60 { left: 200px; }
      .caption-pos20 { left: 800px; }
      .caption-pos120 { left: 1400px; }
    </style>
  </head>
  <body>
    <div class="label">box-shadow offset-x sweep debug - offset-y=0, spread=0, blur=24 fixed - -60px / +20px / +120px, isolated from the spread/dilate bug</div>
    <div class="tile offset-neg60"></div>
    <div class="tile offset-pos20"></div>
    <div class="tile offset-pos120"></div>
    <div class="caption caption-neg60">offset-x: -60px</div>
    <div class="caption caption-pos20">offset-x: +20px</div>
    <div class="caption caption-pos120">offset-x: +120px</div>
  </body>
</html>
