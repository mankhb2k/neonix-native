<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 1500px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Fixed LARGE spread (90px, the value that visibly mismatched in the
        radius:0 sweep) and blur (40px), corner-radius swept 0/20/40/60px -
        checks whether the mismatch is specific to radius:0 (sharp corners)
        or persists at small positive radii too. Our formula is
        newRadius = clamp(cornerRadius + spread, 0, halfOfNewSmallestSide);
        if the mismatch shrinks as radius grows, the bug is likely isolated
        to the radius:0 boundary case specifically (e.g. a 0-radius rRect
        draw path, or a rounding/clamp edge case at the exact zero point)
        rather than the general spread formula.
      */
      .tile { position: absolute; width: 220px; height: 140px; background: #60a5fa; box-shadow: 0 0 40px 90px #60a5fa; }
      .caption { position: absolute; width: 240px; text-align: center; color: #94a3b8; font-family: Inter, sans-serif; font-size: 16px; font-weight: 700; }

      .radius-0 { left: 390px; top: 210px; border-radius: 0; }
      .radius-20 { left: 1310px; top: 210px; border-radius: 20px; }
      .radius-40 { left: 390px; top: 690px; border-radius: 40px; }
      .radius-60 { left: 1310px; top: 690px; border-radius: 60px; }

      .caption-0 { left: 390px; top: 520px; }
      .caption-20 { left: 1310px; top: 520px; }
      .caption-40 { left: 390px; top: 1000px; }
      .caption-60 { left: 1310px; top: 1000px; }
    </style>
  </head>
  <body>
    <div class="label">box-shadow spread debug - fixed spread=90px/blur=40px, cornerRadius swept 0/20/40/60px - checks whether the radius:0 mismatch is a boundary case or affects small positive radii too</div>
    <div class="tile radius-0"></div>
    <div class="tile radius-20"></div>
    <div class="tile radius-40"></div>
    <div class="tile radius-60"></div>
    <div class="caption caption-0">cornerRadius: 0px</div>
    <div class="caption caption-20">cornerRadius: 20px</div>
    <div class="caption caption-40">cornerRadius: 40px</div>
    <div class="caption caption-60">cornerRadius: 60px</div>
  </body>
</html>
