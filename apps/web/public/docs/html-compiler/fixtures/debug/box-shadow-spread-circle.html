<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 900px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Case 1 - circle/pill (cornerRadius == min(width,height)/2). CSS never
        allows border-radius past half the box, so a circle's radius always
        sits exactly at Chrome's ConstrainRadii() clamp boundary already -
        after growing by spread on all sides it must still land exactly on
        that boundary (new radius == half of the new, bigger box) and stay a
        perfect circle. This is the shape real glow orbs use.
      */
      .orb {
        position: absolute;
        left: 860px;
        top: 440px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: #22d3ee;
        box-shadow: 0 0 60px 70px #22d3ee;
      }
    </style>
  </head>
  <body>
    <div class="label">box-shadow spread debug - case 1: circle (radius=100, spread=70) - must stay a perfect circle after growth</div>
    <div id="spread-circle" class="orb"></div>
  </body>
</html>
