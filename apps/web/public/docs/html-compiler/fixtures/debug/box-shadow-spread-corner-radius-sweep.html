<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 1500px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Complements box-shadow-spread-radius-sweep.html (which fixed
        cornerRadius:0 and swept spread) and
        box-shadow-spread-circle-magnitude-sweep.html (which fixed
        cornerRadius at 100% - full circle - and swept spread): this sweep
        fixes spread AND blur constant and instead sweeps cornerRadius as a
        fraction of min(width,height)/2 - 20%, 60%, 100% (full circle) - to
        map how squircle severity scales with how "round" the shape already
        is, independent of spread magnitude. Together the three sweeps fully
        characterize the bug surface: severity depends on BOTH how large
        spread is AND how round the corners already are; a plain rect
        (0% - the other sweep) never shows it regardless of spread.
      */
      .tile { position: absolute; width: 200px; height: 200px; top: 460px; background: #a78bfa; box-shadow: 0 0 60px 70px #a78bfa; }
      .caption { position: absolute; width: 280px; top: 900px; text-align: center; color: #94a3b8; font-family: Inter, sans-serif; font-size: 16px; font-weight: 700; }

      .radius-20 { left: 180px; border-radius: 20px; }
      .radius-60 { left: 740px; border-radius: 60px; }
      .radius-100 { left: 1300px; border-radius: 100px; }

      .caption-20 { left: 160px; }
      .caption-60 { left: 720px; }
      .caption-100 { left: 1280px; }
    </style>
  </head>
  <body>
    <div class="label">box-shadow spread debug - corner-radius sweep (fixed spread=70px, blur=60px) - radius 20px (20%) / 60px (60%) / 100px (100%, full circle) of the 200x200 box's half-side</div>
    <div class="tile radius-20"></div>
    <div class="tile radius-60"></div>
    <div class="tile radius-100"></div>
    <div class="caption caption-20">cornerRadius: 20px (20%)</div>
    <div class="caption caption-60">cornerRadius: 60px (60%)</div>
    <div class="caption caption-100">cornerRadius: 100px (100%, circle)</div>
  </body>
</html>
