<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 1700px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Same card as backdrop-filter-radius-with-children.html, but with
        `overflow: hidden` added and a badge intentionally positioned to
        poke past the top-right rounded corner. With overflow:hidden set,
        real Chrome clips BOTH the backdrop-filter output AND this
        overflowing child to the same rounded border box - the badge's
        corner should be cut off, flush with the card's own rounded edge.
      */
      /*
        A smooth radial gradient, not a hard-edged stripe pattern: blurring a
        continuously-varying gradient visibly shifts/softens color across the
        WHOLE sampled area (matching the real motion-test glow-orb
        background), whereas a flat-color stripe barely changes under blur
        except right at a stripe boundary - a stripe pattern made the bug
        this fixture exists to catch nearly invisible in a screenshot.
      */
      .glow {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        background-image:
          radial-gradient(circle at 30% 70%, #22d3ee 0%, transparent 45%),
          radial-gradient(circle at 70% 30%, #a855f7 0%, transparent 45%),
          radial-gradient(circle at 50% 90%, #facc15 0%, transparent 40%);
      }

      .card {
        position: absolute; left: 760px; top: 340px; width: 400px; height: 220px;
        border-radius: 40px;
        background-color: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(20px);
        overflow: hidden;
      }
      .icon {
        position: absolute; left: 32px; top: 32px; width: 56px; height: 56px;
        border-radius: 14px; background: #22d3ee;
      }
      .caption {
        position: absolute; left: 32px; top: 108px; width: 336px;
        color: #ffffff; font-family: Inter, sans-serif; font-size: 22px; font-weight: 700;
      }
      .badge {
        position: absolute; left: 340px; top: -20px; width: 80px; height: 80px;
        border-radius: 16px; background: #facc15;
      }
    </style>
  </head>
  <body>
    <div class="label">backdrop-filter debug - border-radius + children + overflow:hidden - badge SHOULD be clipped at the rounded corner</div>
    <div class="glow"></div>
    <div class="card">
      <div class="icon"></div>
      <div class="caption">GLASS CARD</div>
      <div class="badge"></div>
    </div>
  </body>
</html>
