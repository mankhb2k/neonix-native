<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#05060a","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #05060a; }
      .label { position: absolute; left: 24px; top: 24px; width: 1870px; color: #64748b; font-family: Inter, sans-serif; font-size: 16px; font-weight: 700; }
      .caption { position: absolute; top: 900px; width: 260px; text-align: center; color: #94a3b8; font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; }

      /*
        The actual bug: in neonix-motion-test-10s.html, `.ring`'s arc stays
        visibly sharp behind `.card`'s `backdrop-filter: blur(18px)` in
        CanvasKit, while real Chrome blurs it away almost completely. Same
        ring (full 760px size, same border/box-shadow/filter as the real
        one) behind two copies of the real card at the SAME vertical band of
        the ring's arc, so both samples about the same underlying
        brightness:
          - left card: backdrop-filter only, no box-shadow of its own -
            isolates whether the backdrop blur alone already fails to hide
            the ring as much as Chrome does.
          - right card: backdrop-filter + the same 2 box-shadows card-a has
            in the real scene - if this one shows the ring MORE clearly than
            the left card, that points at the box-shadow's own
            `boxEffectDrawnEarly` timing polluting the backdrop capture
            (see card-own-shadow-in-backdrop.html), not the blur itself.
        Ring is held at a fixed angle (see ring-rotation-symmetric-control.html
        for why rotation itself is not a variable here) and a fixed
        mid-cycle filter value (blur(2px) hue-rotate(25deg)).
      */
      .ring {
        position: absolute;
        left: 580px;
        top: 160px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        border: 2px solid rgba(168, 85, 247, 0.35);
        box-shadow: 0 0 60px rgba(168, 85, 247, 0.25) inset, 0 0 40px rgba(34, 211, 238, 0.2);
        filter: blur(2px) hue-rotate(25deg);
      }
      .card {
        position: absolute;
        top: 420px;
        width: 230px;
        height: 230px;
        border-radius: 28px;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(18px);
      }
      .card-no-shadow { left: 700px; }
      .card-with-shadow { left: 1200px; box-shadow: 0 0 50px rgba(34, 211, 238, 0.35), 0 20px 40px rgba(0, 0, 0, 0.4); }

      .caption-no-shadow { left: 700px; }
      .caption-with-shadow { left: 1200px; }
    </style>
  </head>
  <body>
    <div class="label">Ring behind a backdrop-filter card - the real motion-test bug, minimally reproduced. Both cards sample the same ring arc band; compare how much of the ring shows through each, in browser vs CanvasKit.</div>
    <div class="ring"></div>
    <div class="card card-no-shadow"></div>
    <div class="card card-with-shadow"></div>
    <div class="caption caption-no-shadow">backdrop-filter only</div>
    <div class="caption caption-with-shadow">backdrop-filter + card's own box-shadow</div>
  </body>
</html>
