<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 1500px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Foundation check for spread-radius, mirroring offset-x/offset-y-sweep:
        cornerRadius:0 here on purpose (a PLAIN axis-aligned rect, no
        border-radius at all). A rectangular MakeDilate/MakeErode kernel
        cannot distort a shape whose own edges are already axis-aligned - a
        box-filter dilate of a rect is exactly a bigger rect, no squircle
        possible. This isolates "does spread itself translate to the right
        geometry" from the separate, already-confirmed "rounded/circular
        corners + rectangular-kernel dilate = squircle" bug: if this sweep
        matches Chrome cleanly while the circle sweep does not, that pins
        the bug specifically on corner rounding, not on spread math itself.
        Three examples: negative (erode), small positive, larger positive.
        offset stays 0,0 throughout.
      */
      .tile { position: absolute; width: 220px; height: 140px; top: 470px; background: #fbbf24; }
      .caption { position: absolute; width: 280px; top: 900px; text-align: center; color: #94a3b8; font-family: Inter, sans-serif; font-size: 16px; font-weight: 700; }

      .spread-neg40 { left: 260px; box-shadow: 0 0 40px -40px #fbbf24; }
      .spread-pos20 { left: 860px; box-shadow: 0 0 40px 20px #fbbf24; }
      .spread-pos90 { left: 1460px; box-shadow: 0 0 40px 90px #fbbf24; }

      .caption-neg40 { left: 200px; }
      .caption-pos20 { left: 800px; }
      .caption-pos90 { left: 1400px; }
    </style>
  </head>
  <body>
    <div class="label">box-shadow spread-radius sweep debug - PLAIN rect (cornerRadius:0), offset=0, blur=40 fixed - spread -40px / +20px / +90px - isolates spread math from the corner-rounding squircle bug</div>
    <div class="tile spread-neg40"></div>
    <div class="tile spread-pos20"></div>
    <div class="tile spread-pos90"></div>
    <div class="caption caption-neg40">spread: -40px</div>
    <div class="caption caption-pos20">spread: +20px</div>
    <div class="caption caption-pos90">spread: +90px</div>
  </body>
</html>
