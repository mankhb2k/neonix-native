<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 1100px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Same circle/spread/blur as box-shadow-spread-circle.html, but the
        shadow is listed TWICE (identical values). CSS renders this
        identically to a single shadow (the first one just paints on top of
        an equal copy of itself), but it changes which Neonix code path
        renders it: a single, non-inset box-shadow with no other filter takes
        the "ordinary" DropShadow-ImageFilter path (still uses a rectangular
        MakeDilate/MakeErode on the rasterized mask - the squircle bug), while
        a *list* of 2+ shadows is only recognized by
        canvaskit-preview/effects.ts's boxShadowBranches() (which requires
        branches.length > 1), which forces `sourceOnly: true` and routes
        through replay.ts's drawBoxEffect - the isolated-mask compositor that
        was fixed this session to use analytic geometry expansion instead of
        a raster dilate filter.
        This fixture pairs 1:1 with box-shadow-spread-circle.html (same
        visual CSS output) to isolate "is the routing bug present" from "is
        the geometry-expansion fix itself correct" - compare this fixture's
        native render against that one's: if only this one renders as a
        perfect circle, the fix is correct and the bug is purely in routing.
      */
      .orb {
        position: absolute;
        left: 860px;
        top: 440px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: #22d3ee;
        box-shadow: 0 0 60px 70px #22d3ee, 0 0 60px 70px #22d3ee;
      }
    </style>
  </head>
  <body>
    <div class="label">box-shadow spread debug - case 1b: circle, IDENTICAL shadow listed twice (forces the fixed drawBoxEffect route) - pairs with box-shadow-spread-circle.html</div>
    <div id="spread-circle-2shadow" class="orb"></div>
  </body>
</html>
