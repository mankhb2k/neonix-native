<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#0b1220","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b1220; }

      .label { position: absolute; left: 24px; top: 24px; width: 900px; color: #64748b; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; }

      /*
        Case 2 - a normal rounded rect whose corner radius is well under
        half its smallest side (24 << 100). Because CSS never lets
        border-radius exceed min(width,height)/2 to begin with, growing
        both the box and the radius by the same `spread` on every side can
        never push (radius+spread) past half the new smallest side either -
        so Chrome's ConstrainRadii() clamp is provably a no-op here, however
        large spread gets. This case exists to prove the unclamped linear
        growth formula (newRadius = radius + spread) matches Chrome pixel
        for pixel, even at a spread (80) larger than the radius itself.
      */
      .card {
        position: absolute;
        left: 660px;
        top: 390px;
        width: 400px;
        height: 200px;
        border-radius: 24px;
        background: #f472b6;
        box-shadow: 0 0 40px 80px #f472b6;
      }
    </style>
  </head>
  <body>
    <div class="label">box-shadow spread debug - case 2: rounded rect (radius=24, spread=80) - unclamped linear growth, clamp never binds</div>
    <div id="spread-rounded-rect" class="card"></div>
  </body>
</html>
