<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"background":"#140f2a","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        position: relative;
        overflow: hidden;
        background: #140f2a;
        color: #fff7ed;
        font-family: Inter;
      }

      @keyframes creative-hero {
        0% { opacity: 0; transform: scale(3) rotate(-8deg); }
        10% { opacity: 1; transform: scale(1) rotate(0deg); }
        19% { opacity: 1; transform: scale(1) rotate(0deg); }
        25% { opacity: 0; transform: scale(0.86) rotate(3deg); }
        100% { opacity: 0; transform: scale(0.86) rotate(3deg); }
      }

      @keyframes creative-sequence {
        0%, 20% { opacity: 0; transform: translateX(-260px); }
        30% { opacity: 1; transform: translateX(0px); }
        64% { opacity: 1; transform: translateX(0px); }
        73%, 100% { opacity: 0; transform: translateX(80px); }
      }

      @keyframes creative-shape {
        0%, 20% { opacity: 0; transform: translateY(170px) rotate(-30deg) scale(0.5); }
        32% { opacity: 1; transform: translateY(0px) rotate(0deg) scale(1); }
        64% { opacity: 1; transform: translateY(0px) rotate(0deg) scale(1); }
        73%, 100% { opacity: 0; transform: translateY(-80px) rotate(18deg) scale(0.8); }
      }

      @keyframes creative-dot-path {
        0% { opacity: 0; offset-distance: 0%; }
        26% { opacity: 1; offset-distance: 0%; }
        67% { opacity: 1; offset-distance: 100%; }
        75%, 100% { opacity: 0; offset-distance: 100%; }
      }

      @keyframes creative-card-one {
        0%, 48% { opacity: 0; transform: translateZ(-240px) translateY(80px) rotate(-12deg); }
        60% { opacity: 1; transform: translateZ(0px) translateY(0px) rotate(0deg); }
        72% { opacity: 1; transform: translateZ(0px) translateY(0px) rotate(0deg); }
        80%, 100% { opacity: 0; transform: translateZ(-80px) translateY(-40px) rotate(-5deg); }
      }

      @keyframes creative-card-two {
        0%, 51% { opacity: 0; transform: translateZ(-240px) translateY(80px) rotate(10deg); }
        63% { opacity: 1; transform: translateZ(0px) translateY(0px) rotate(0deg); }
        72% { opacity: 1; transform: translateZ(0px) translateY(0px) rotate(0deg); }
        80%, 100% { opacity: 0; transform: translateZ(-80px) translateY(-40px) rotate(5deg); }
      }

      @keyframes creative-card-three {
        0%, 54% { opacity: 0; transform: translateZ(-240px) translateY(80px) rotate(-8deg); }
        66% { opacity: 1; transform: translateZ(0px) translateY(0px) rotate(0deg); }
        72% { opacity: 1; transform: translateZ(0px) translateY(0px) rotate(0deg); }
        80%, 100% { opacity: 0; transform: translateZ(-80px) translateY(-40px) rotate(-4deg); }
      }

      @keyframes creative-final {
        0%, 70% { opacity: 0; transform: scale(0.58) rotate(-12deg); }
        82% { opacity: 1; transform: scale(1) rotate(0deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      #creative-wash {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(135deg, #140f2a, #3b176b 52%, #f97316);
        opacity: 0.34;
      }

      #creative-ring {
        position: absolute;
        left: 620px;
        top: 220px;
        width: 680px;
        height: 680px;
        box-sizing: border-box;
        border: 2px solid #fb7185;
        border-radius: 340px;
        opacity: 0.55;
        animation: creative-shape 10s linear both;
      }

      #creative-hero {
        position: absolute;
        left: 120px;
        top: 310px;
        width: 1680px;
        height: 220px;
        margin: 0;
        color: #fff7ed;
        font-size: 154px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -8px;
        text-align: center;
        animation: creative-hero 10s linear both;
      }

      #creative-sequence {
        position: absolute;
        left: 260px;
        top: 330px;
        width: 1400px;
        height: 230px;
        margin: 0;
        color: #fff7ed;
        font-size: 92px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -4px;
        text-align: center;
        animation: creative-sequence 10s linear both;
      }

      #creative-sequence span {
        color: #fb7185;
      }

      #creative-route {
        position: absolute;
        left: 360px;
        top: 750px;
        width: 1200px;
        height: 3px;
        background: #fb7185;
        opacity: 0.6;
        transform: rotate(-12deg);
        animation: creative-sequence 10s linear both;
      }

      #creative-dot {
        position: absolute;
        left: 355px;
        top: 744px;
        width: 18px;
        height: 18px;
        border-radius: 9px;
        background: #fbbf24;
        offset-path: path("M 0 0 C 280 -160, 610 180, 1180 -20");
        offset-distance: 0%;
        animation: creative-dot-path 10s linear both;
      }

      #creative-shape-one, #creative-shape-two, #creative-shape-three {
        position: absolute;
        width: 92px;
        height: 92px;
        box-shadow: 0 16px 40px 0 #0f172a;
        animation: creative-shape 10s linear both;
      }

      #creative-shape-one {
        left: 250px;
        top: 150px;
        border-radius: 46px;
        background: #fb7185;
      }

      #creative-shape-two {
        left: 1530px;
        top: 170px;
        border-radius: 12px;
        background: #fbbf24;
      }

      #creative-shape-three {
        left: 1480px;
        top: 810px;
        background: #38bdf8;
        transform: rotate(45deg);
      }

      #creative-stage {
        position: absolute;
        left: 480px;
        top: 170px;
        width: 960px;
        height: 700px;
        perspective: 1000px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }

      .creative-card {
        position: absolute;
        width: 300px;
        height: 390px;
        box-sizing: border-box;
        padding: 28px;
        border: 2px solid #fff7ed;
        border-radius: 26px;
        background: #23113f;
        box-shadow: 0 22px 50px 0 #0f172a;
        color: #fff7ed;
        text-align: center;
      }

      #creative-card-one { left: 0; top: 160px; animation: creative-card-one 10s linear both; }
      #creative-card-two { left: 330px; top: 60px; animation: creative-card-two 10s linear both; }
      #creative-card-three { left: 660px; top: 160px; animation: creative-card-three 10s linear both; }

      .creative-card-number {
        margin: 0;
        color: #fbbf24;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 3px;
      }

      .creative-card-title {
        margin: 90px 0 0;
        font-size: 36px;
        font-weight: 700;
      }

      .creative-card-copy {
        margin: 18px 0 0;
        color: #c4b5fd;
        font-size: 22px;
      }

      #creative-final {
        position: absolute;
        left: 520px;
        top: 250px;
        width: 880px;
        height: 430px;
        box-sizing: border-box;
        padding: 78px 50px;
        border: 3px solid #fbbf24;
        border-radius: 40px;
        background: #23113f;
        box-shadow: 0 0 70px 0 #7c2d5d;
        text-align: center;
        animation: creative-final 10s linear both;
      }

      #creative-final-mark {
        margin: 0;
        color: #fbbf24;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 8px;
      }

      #creative-final-title {
        margin: 54px 0 0;
        color: #fff7ed;
        font-size: 72px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -3px;
      }

      #creative-footer {
        position: absolute;
        left: 150px;
        top: 950px;
        color: #c4b5fd;
        font-size: 20px;
        letter-spacing: 4px;
      }
    </style>
  </head>
  <body>
    <div id="creative-wash"></div>
    <div id="creative-ring"></div>
    <div id="creative-shape-one"></div>
    <div id="creative-shape-two"></div>
    <div id="creative-shape-three"></div>
    <h1 id="creative-hero">MAKE IT MOVE</h1>
    <p id="creative-sequence">Design <span>→</span> Motion <span>→</span> Story</p>
    <div id="creative-route"></div>
    <div id="creative-dot"></div>
    <section id="creative-stage">
      <article id="creative-card-one" class="creative-card">
        <p class="creative-card-number">01</p>
        <p class="creative-card-title">Design</p>
        <p class="creative-card-copy">Start with one idea.</p>
      </article>
      <article id="creative-card-two" class="creative-card">
        <p class="creative-card-number">02</p>
        <p class="creative-card-title">Motion</p>
        <p class="creative-card-copy">Give it a rhythm.</p>
      </article>
      <article id="creative-card-three" class="creative-card">
        <p class="creative-card-number">03</p>
        <p class="creative-card-title">Story</p>
        <p class="creative-card-copy">Make it memorable.</p>
      </article>
    </section>
    <section id="creative-final">
      <p id="creative-final-mark">NEONIX CREATIVE</p>
      <p id="creative-final-title">Create Without<br>Limits</p>
    </section>
    <small id="creative-footer">CREATIVE MOTION / 003 / 10 SEC</small>
  </body>
</html>
