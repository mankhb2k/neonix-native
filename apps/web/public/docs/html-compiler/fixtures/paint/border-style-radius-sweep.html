<!doctype html>
<html lang="en">
  <head>
    <!--
      DEBUG: html-compiler uses TWO completely different algorithms for
      border-style:dashed/dotted depending on corner radius —
        radius === 0: discrete polygon/ellipse shapes, fitBorderDashRuns()
        radius  >  0: a stroked path with a fixed strokeDash rhythm
          (dashed -> [width*2, width]; dotted -> [width*0.01, width*2-eps])
      Does the rendering look continuous across the radius=0 -> radius>0
      boundary, and does either algorithm actually match the real browser
      at each radius? Fixed border-width=12px; radius sweeps
      0, 1, 8, 24, 64px left to right. Row 1 = dashed, row 2 = dotted.
    -->
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #081018; }
      .box { position: absolute; width: 300px; height: 170px; background: #172554; }
      .r0 { top: 100px; }
      .r1 { top: 420px; }
      .c0 { left: 60px; }
      .c1 { left: 420px; }
      .c2 { left: 780px; }
      .c3 { left: 1140px; }
      .c4 { left: 1500px; }
      #dashed-radius-0  { border: 12px dashed #38bdf8; border-radius: 0px; }
      #dashed-radius-1  { border: 12px dashed #38bdf8; border-radius: 1px; }
      #dashed-radius-8  { border: 12px dashed #38bdf8; border-radius: 8px; }
      #dashed-radius-24 { border: 12px dashed #38bdf8; border-radius: 24px; }
      #dashed-radius-64 { border: 12px dashed #38bdf8; border-radius: 64px; }
      #dotted-radius-0  { border: 12px dotted #fb7185; border-radius: 0px; }
      #dotted-radius-1  { border: 12px dotted #fb7185; border-radius: 1px; }
      #dotted-radius-8  { border: 12px dotted #fb7185; border-radius: 8px; }
      #dotted-radius-24 { border: 12px dotted #fb7185; border-radius: 24px; }
      #dotted-radius-64 { border: 12px dotted #fb7185; border-radius: 64px; }
    </style>
  </head>
  <body>
    <div id="dashed-radius-0"  class="box r0 c0"></div>
    <div id="dashed-radius-1"  class="box r0 c1"></div>
    <div id="dashed-radius-8"  class="box r0 c2"></div>
    <div id="dashed-radius-24" class="box r0 c3"></div>
    <div id="dashed-radius-64" class="box r0 c4"></div>
    <div id="dotted-radius-0"  class="box r1 c0"></div>
    <div id="dotted-radius-1"  class="box r1 c1"></div>
    <div id="dotted-radius-8"  class="box r1 c2"></div>
    <div id="dotted-radius-24" class="box r1 c3"></div>
    <div id="dotted-radius-64" class="box r1 c4"></div>
  </body>
</html>
