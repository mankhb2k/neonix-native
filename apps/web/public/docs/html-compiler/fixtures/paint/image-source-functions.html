<!doctype html>
<html lang="en">
  <head>

      .url-fn { left: 80px; background-image: image(url("/preview/image/photo-landscape.jpg")); background-position: center; background-size: cover; }

      .cross-fade { left: 1360px; background-image: cross-fade(url("/preview/image/photo-landscape.jpg"), url("/preview/image/photo-portrait.jpg"), 50%); background-position: center; background-size: cover; }
    </style>
  </head>
  <body>
    <div class="cell-label cell-label-1">image(url(...))</div>
    <div class="cell-label cell-label-2">image(gradient, fallback-color)</div>
    <div class="cell-label cell-label-3">cross-fade(url, url, 50%)</div>

    <div id="paint-image-function-url" class="box url-fn"></div>
    <div id="paint-image-function-gradient" class="box gradient-fallback"></div>
    <div id="paint-cross-fade" class="box cross-fade"></div>
  </body>
</html>
