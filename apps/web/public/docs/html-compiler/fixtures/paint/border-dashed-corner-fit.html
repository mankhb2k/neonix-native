<!doctype html>
<html lang="en">
  <head>
    <!--
      REGRESSION: border-style:dashed with sharp corners (no border-radius)
      must place a whole number of fixed-length (2x border-width) dashes,
      anchored at BOTH ends of every edge, so every corner is fully solid --
      not a periodic tiling that only anchors the start, which used to leave
      alternating corners unfilled. Verified pixel-for-pixel against Chrome
      at this exact border-width (60px) on both a square and a 3:2
      rectangle. See packages/html-compiler/src/compiler/pipeline/border/geometry.ts (fitBorderDashRuns).
    -->
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #081018; }
      .box { position: absolute; background: #172554; box-sizing: border-box; border: 60px dashed #38bdf8; }
      #square    { left: 140px; top: 130px; width: 400px; height: 400px; }
      #rectangle { left: 740px; top: 130px; width: 300px; height: 600px; }
    </style>
  </head>
  <body>
    <div id="square" class="box"></div>
    <div id="rectangle" class="box"></div>
  </body>
</html>
