<!doctype html>
<html lang="en">
  <head>
    <!--
      DEBUG: reverse-engineer how Chrome actually anchors/counts dashes on a
      rounded border. The single-closed-perimeter uniform-tiling model
      (fitRoundedBorderDash) does NOT reproduce Chrome's output -- Chrome's
      pattern is clearly mirror-symmetric per corner and per edge (a dash
      sits centered in the middle of each straight edge, and a dash wraps
      each corner arc symmetrically), which looks structurally like the
      SAME "anchor both ends" per-edge algorithm as the no-radius case,
      with the corner arcs getting their own independent, phase-connected
      treatment -- not a single arbitrary-offset cyclic tiling of the whole
      perimeter. One clean square box + a radius/width/size sweep to map
      the exact rule empirically before changing fitRoundedBorderDash.
    -->
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #081018; }
      .box { position: absolute; top: 120px; background: #172554; box-sizing: border-box; border: 30px dashed #38bdf8; }
      #s1 { left: 60px;   width: 400px; height: 400px; border-radius: 60px; }
      #s2 { left: 540px;  width: 400px; height: 400px; border-radius: 30px; }
      #s3 { left: 1020px; width: 400px; height: 400px; border-radius: 100px; }
      #s4 { left: 1500px; width: 300px; height: 300px; border-radius: 60px; }
    </style>
  </head>
  <body>
    <div id="s1" class="box"></div>
    <div id="s2" class="box"></div>
    <div id="s3" class="box"></div>
    <div id="s4" class="box"></div>
  </body>
</html>
