<!doctype html>
<html lang="en">

  </head>
  <body>
    <div class="cell-label cell-label-1">Combined (outer + inner)</div>

    <div class="cell-label cell-label-4">Mixed colors</div>
    <div class="cell-label cell-label-5">Overlay only (no radius/border)</div>

    <div id="outer-inner-glow-combined" class="glow-box combined"></div>
    <div id="outer-inner-glow-order" class="glow-box outer-first"></div>
    <div id="inner-outer-glow-order" class="glow-box inner-first"></div>
    <div id="mixed-glow-order-colors" class="glow-box mixed-colors"></div>

</html>
