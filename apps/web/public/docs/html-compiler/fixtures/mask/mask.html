<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #081018; }
      .cell-label { position: absolute; width: 560px; font-family: Inter, sans-serif; font-size: 24px; font-weight: 700; color: #7c93a8; }
      .cell-label-1 { left: 40px; top: 40px; }
      .cell-label-2 { left: 680px; top: 40px; }
      .cell-label-3 { left: 1320px; top: 40px; }
      .cell-label-4 { left: 40px; top: 580px; }
      .cell-label-5 { left: 680px; top: 580px; }
      .box { position: absolute; width: 500px; height: 280px; box-sizing: border-box; }

      .alpha-gradient { left: 70px; top: 220px; background: #2563eb; mask-image: linear-gradient(90deg, #00000000 0%, #000000ff 50%, #00000000 100%); mask-mode: alpha; mask-repeat: no-repeat; }
      .luminance-image { left: 710px; top: 220px; background: #f97316; mask-image: url(/preview/image/img-alpha.png); mask-mode: luminance; mask-position: center; mask-size: 340px 200px; mask-repeat: no-repeat; }
      .add-intersect {
        left: 1350px; top: 220px; background: #22c55e;
        mask-image:
          linear-gradient(90deg, #000000ff 0%, #000000ff 64%, #00000000 64%),
          radial-gradient(circle at 88% 50%, #000000ff 0%, #000000ff 30%, #00000000 32%),
          linear-gradient(90deg, #00000000 8%, #000000ff 8%, #000000ff 92%, #00000000 92%);
        mask-mode: alpha, alpha, alpha;
        mask-composite: add, intersect;
        mask-repeat: no-repeat, no-repeat, no-repeat;
      }
      .subtract-edge {
        left: 70px; top: 760px; background: #a855f7;
        mask-image: linear-gradient(90deg, #000000ff 0%, #000000ff 100%), radial-gradient(circle at 30% 50%, #000000ff 0%, #000000ff 28%, #00000000 30%);
        mask-mode: alpha, alpha;
        mask-composite: subtract;
        mask-repeat: no-repeat, no-repeat;
      }
      .clip-isolation {
        left: 710px; top: 760px; background: #1e3a8a; isolation: isolate;
        clip-path: inset(12px round 36px);
        mask-image: radial-gradient(ellipse at 50% 50%, #ffffff 0%, #000000 72%);
        mask-mode: alpha; mask-repeat: no-repeat;
      }
      .clip-isolation-child { position: absolute; left: 90px; top: 60px; width: 320px; height: 160px; background: #f97316; mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div class="cell-label cell-label-1">Alpha mask, linear gradient</div>
    <div class="cell-label cell-label-2">Luminance mask, image source</div>
    <div class="cell-label cell-label-3">3-layer mask, add + intersect</div>
    <div class="cell-label cell-label-4">2-layer mask, subtract at edge</div>
    <div class="cell-label cell-label-5">mask + clip-path + isolation</div>

    <div id="mask-alpha-gradient" class="box alpha-gradient"></div>
    <div id="mask-luminance-image" class="box luminance-image"></div>
    <div id="mask-add-intersect" class="box add-intersect"></div>
    <div id="mask-subtract-edge" class="box subtract-edge"></div>
    <div id="mask-clip-isolation" class="box clip-isolation">
      <div id="mask-clip-isolation-child" class="clip-isolation-child"></div>
    </div>
  </body>
</html>
