<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #081018; }
      .cell-label { position: absolute; width: 800px; font-family: Inter, sans-serif; font-size: 24px; font-weight: 700; color: #7c93a8; }
      .cell-label-1 { left: 60px; top: 60px; }
      .cell-label-2 { left: 960px; top: 60px; }
      #flow-row { position: absolute; left: 60px; top: 130px; width: 800px; height: 640px; display: grid; grid-template-columns: 240px 240px; grid-template-rows: 140px 140px; gap: 16px; }
      #flow-column { position: absolute; left: 960px; top: 130px; width: 800px; height: 640px; display: grid; grid-template-columns: 240px 240px; grid-template-rows: 140px 140px; grid-auto-flow: column; gap: 16px; }
      #flow-row p, #flow-column p { display: flex; align-items: center; justify-content: center; margin: 0; color: #081018; font-family: Inter; font-size: 28px; font-weight: 700; }
      #row-a { background: #22d3ee; }
      #row-b { background: #fb7185; }
      #row-c { background: #4ade80; }
      #row-d { background: #38bdf8; }
      #row-e { background: #facc15; }
      #col-a { background: #22d3ee; }
      #col-b { background: #fb7185; }
      #col-c { background: #4ade80; }
      #col-d { background: #38bdf8; }
      #col-e { background: #facc15; }
    </style>
  </head>
  <body>
    <div class="cell-label cell-label-1">grid-auto-flow: row (default) - 5 items fill row-major, growing a 3rd row</div>
    <div class="cell-label cell-label-2">grid-auto-flow: column - same 5 items fill column-major, growing a 3rd column</div>

    <div id="flow-row">
      <p id="row-a">a</p>
      <p id="row-b">b</p>
      <p id="row-c">c</p>
      <p id="row-d">d</p>
      <p id="row-e">e</p>
    </div>

    <div id="flow-column">
      <p id="col-a">a</p>
      <p id="col-b">b</p>
      <p id="col-c">c</p>
      <p id="col-d">d</p>
      <p id="col-e">e</p>
    </div>
  </body>
</html>
