<!doctype html>
<html lang="en">
  <head>
    <meta name="neonix-document" content='{"kind":"neonix-html-document","schemaVersion":2,"composition":{"width":1920,"height":1080,"fps":30,"durationMs":1000,"background":"#081018","colorSpace":"srgb"}}'>
    <style data-neonix-bundle>
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #081018; }
      .cell-label { position: absolute; width: 900px; font-family: Inter, sans-serif; font-size: 22px; font-weight: 700; color: #7c93a8; }
      .cell-label-1 { left: 20px; top: 20px; }
      .cell-label-2 { left: 960px; top: 20px; }

      #grid-placement { position: absolute; left: 0px; top: 64px; width: 960px; height: 680px; display: grid; grid-template-columns: 240px 240px 240px; grid-template-rows: 160px 200px 180px; gap: 24px; }
      #placement-one { grid-column-start: 1; grid-column-end: 3; grid-row-start: 1; grid-row-end: 2; background: #22d3ee; }
      #placement-two { grid-column-start: 3; grid-column-end: 4; grid-row-start: 1; grid-row-end: 3; background: #a78bfa; }
      #placement-three { grid-column-start: 1; grid-column-end: 2; grid-row-start: 3; grid-row-end: 4; background: #fb7185; }

      #grid-spans { position: absolute; left: 960px; top: 64px; width: 960px; height: 680px; display: grid; grid-template-columns: 240px 1fr 1fr; grid-template-rows: 220px 220px; gap: 24px; }
      #span-hero { grid-column: 1 / span 2; grid-row: 1 / span 2; background: #38bdf8; }
      #span-side { grid-column: 3 / 4; grid-row: 1 / 3; background: #fb7185; }
    </style>
  </head>
  <body>
    <div class="cell-label cell-label-1">explicit grid-column/row-start/end, one spans 2 cols, one spans 2 rows</div>
    <div class="cell-label cell-label-2">grid-column/row shorthand + span, spanning item over fr tracks</div>

    <div id="grid-placement">
      <div id="placement-one"></div>
      <div id="placement-two"></div>
      <div id="placement-three"></div>
    </div>

    <div id="grid-spans">
      <div id="span-hero"></div>
      <div id="span-side"></div>
    </div>
  </body>
</html>
