steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --file=infra/cloud-run/export-renderer/skia-cpu-bench/Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/neonix-506607/neonix/skia-cpu-bench:20260916
